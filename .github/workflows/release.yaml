name: Release

# Builds the Companion module package (.tgz) and attaches it to a GitHub Release.
# Runs when a version tag like v2.1.9 is pushed, or by hand from the Actions tab
# (Run workflow, then enter the tag). If the release does not exist yet it is created.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach, for example v2.1.9'
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Build package and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Check version
        # Stops the build if the tag does not match package.json, or if it is not
        # higher than every other published release.
        run: |
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          OTHERS=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -vx "$TAG" || true)
          HIGHEST=$(printf '%s\n%s\n' "$OTHERS" "$TAG" | sed '/^$/d' | sed 's/^v//' | sort -V | tail -1)
          if [ "$HIGHEST" != "$VERSION" ]; then
            echo "::error::Version $VERSION is not higher than existing release v$HIGHEST"
            exit 1
          fi
      - name: Prepare Environment
        run: corepack enable
      - name: Prepare module
        run: yarn install
        env:
          CI: true
      - name: Build package
        run: yarn package
        env:
          CI: true
      - name: Create release if needed and attach package
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --latest
          fi
          gh release upload "$TAG" ./*.tgz
